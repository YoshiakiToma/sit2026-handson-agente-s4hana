_schema-version: 3.3.0
ID: sales-order-agent
version: 1.0.0
description: "Hands-on SIT 2026 - Agente A2A de ordens de venda (CAP + LangGraph), versao para BTP trial"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
modules:
  - name: sales-order-agent-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1          # 1 instancia: memoria da conversa e tasks A2A ficam em memoria
      memory: 1G            # mesmo valor da PoC (validado); a cota do trial comporta
      buildpack: nodejs_buildpack
    properties:
      DATA_MODE: mock       # dados ficticios (ordens 4711, 4712, 4713, 4714)
      # MODEL_NAME: padrao anthropic--claude-4.5-sonnet no gateway; defina so se o instrutor indicar outro
      MCP_DESTINATION: SALES_ORDER_MCP   # Ex. 5: destination do servidor MCP do S/4HANA
      # O LLM (AI Token Gateway) e configurado DEPOIS do deploy (o segredo nao fica no mta.yaml):
      #   cf set-env sales-order-agent-srv AITG_URL <url do gateway>
      #   cf set-env sales-order-agent-srv AITG_API_KEY <api key aitg_...>
      #   cf restage sales-order-agent-srv
      # Sem essas variaveis o agente roda no modo fake.
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev
      ignore:
        - node_modules
        - .env
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-uri}
    requires:
      - name: sales-order-agent-auth
      - name: sales-order-agent-destination

resources:
  # XSUAA: protege o endpoint A2A (JWT com o escopo Agent.Invoke).
  - name: sales-order-agent-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sales-order-agent-${org}-${space}
        tenant-mode: dedicated

  # Destination service: o agente le a destination SALES_ORDER_MCP (Ex. 5) da sua subaccount.
  - name: sales-order-agent-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
